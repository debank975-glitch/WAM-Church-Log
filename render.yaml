services:
  - type: web
    name: hermes-financial-log
    env: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /auth.html
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_PROVIDER
        value: postgres
      - key: DATABASE_PATH
        value: ./data/hermes.sqlite
      - key: SESSION_SECRET
        sync: false
      - key: ADMIN_SETUP_CODE
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PGSSLMODE
        value: require
      - key: SESSION_TTL_DAYS
        value: "7"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: RATE_LIMIT_MAX
        value: "20"
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_SENDER
        sync: false
      - key: GMAIL_REDIRECT_URI
        value: https://hermes-financial-log.onrender.com/oauth2callback
      - key: GMAIL_OAUTH_SETUP_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
